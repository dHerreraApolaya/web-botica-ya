services:
  identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: boticaya_identity
      POSTGRES_USER: boticaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "5433:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data

volumes:
  identity-postgres-data:
